<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lap Counter</title>
<style>
@font-face { font-family: "Barlow Condensed"; font-weight: 600; src: url("fonts/BarlowCondensed-SemiBold.ttf") format("truetype"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url("fonts/BarlowCondensed-Bold.ttf") format("truetype"); }
@font-face { font-family: "Barlow"; font-weight: 500; src: url("fonts/Barlow-Medium.ttf") format("truetype"); }
@font-face { font-family: "Barlow"; font-weight: 600; src: url("fonts/Barlow-SemiBold.ttf") format("truetype"); }
[hidden] { display: none !important; }
/* One-screen phone tool: each screen fills the viewport; the action you need next is always the biggest thing on it. Deliberately single dark look, as agreed on the mockups. */
:root {
  color-scheme: dark;
  --bg: #0E0F11;
  --surface: #1A1C1F;
  --surface-2: #222429;
  --line: #2C2F33;
  --line-strong: #3E4147;
  --fg: #F2F2F0;
  --muted: #A4A7AB;
  --go: #C6F432;
  --go-ink: #0E0F11;
  --go-tint: #1E2414;
  --pause: #FFB547;
  --stop: #FF6B5E;
  --scrim: rgba(5, 6, 7, 0.72);
  --font-display: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html { height: 100%; box-sizing: border-box; background: var(--bg); }
*, *::before, *::after { box-sizing: border-box; }
body {
  height: 100%; margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.35;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
#app { height: 100%; }
h1, h2, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
button:disabled { opacity: 0.38; cursor: not-allowed; }

.screen {
  height: 100%; max-width: 560px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 12px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-y: auto;
}
.muted { color: var(--muted); }
.eyebrow { font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--muted); }
.h1 { font-family: var(--font-display); font-weight: 700; font-size: 38px; line-height: 1; text-wrap: balance; }
.num { font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.label { font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }

.btn {
  min-height: 64px; border-radius: 22px; border: 2px solid var(--line-strong); background: transparent;
  font-family: var(--font-display); font-weight: 700; font-size: 28px; letter-spacing: 0.08em; text-transform: uppercase;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 10px;
}
.btn .btn-line { display: flex; align-items: center; gap: 10px; }
.btn small { font-family: var(--font-body); font-size: 13px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--fg); }
.btn-go { background: var(--go); border-color: var(--go); color: var(--go-ink); }
.btn-go small { color: var(--go-ink); }
.btn-pause { background: var(--pause); border-color: var(--pause); color: var(--go-ink); }
.btn-stop { border-color: var(--stop); color: var(--stop); }
.btn-safe { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.btn:active, .big:active, .start-dial:active, .key:active { filter: brightness(0.88); }
.row { display: flex; gap: 12px; }
.row > * { flex: 1 1 0; min-width: 0; }
.row > .wide { flex-grow: 2; }
svg { flex: none; }

/* Home */
.home { justify-content: space-between; text-align: center; position: relative; }
.close-btn {
  position: absolute; top: 12px; right: max(8px, env(safe-area-inset-right, 0px));
  width: 48px; height: 48px; border: none; border-radius: 50%; background: transparent; color: var(--muted);
  display: flex; align-items: center; justify-content: center; opacity: 0.8;
}
.close-btn:active { background: var(--surface); }
.home-head { display: flex; flex-direction: column; gap: 6px; padding-top: 12px; }
.start-dial {
  width: min(78vw, 300px); max-width: 100%; aspect-ratio: 1; margin: 0 auto; border-radius: 50%; border: none;
  background: var(--go); color: var(--go-ink); box-shadow: 0 0 0 14px var(--go-tint);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
}
.start-dial .num { font-size: clamp(56px, 21vw, 84px); letter-spacing: 0.05em; }
.start-dial small { font-weight: 600; font-size: 15px; }

/* Setup */
.fields { display: flex; flex-direction: column; gap: 10px; }
.field { width: 100%; text-align: left; border: none; background: none; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.field-top { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; color: var(--muted); }
.field-box {
  display: flex; align-items: baseline; gap: 8px; height: 76px; padding: 0 20px; border-radius: 20px;
  background: var(--surface); border: 2px solid var(--line);
}
.field[aria-pressed="true"] .field-box { border: 3px solid var(--go); }
.field-val { font-size: 62px; align-self: center; }
.field-val.empty { color: var(--line-strong); }
.unit { font-family: var(--font-display); font-weight: 600; font-size: 28px; color: var(--muted); }
.keypad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.key { height: clamp(50px, 7.4vh, 66px); border-radius: 16px; border: none; background: var(--surface-2); font-family: var(--font-display); font-weight: 600; font-size: 34px; display: flex; align-items: center; justify-content: center; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.switch, .chip {
  min-height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px;
}
.knob { width: 38px; height: 22px; border-radius: 11px; background: var(--line-strong); position: relative; }
.knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--fg); transition: transform 0.15s; }
.switch[aria-checked="true"] .knob { background: var(--go); }
.switch[aria-checked="true"] .knob::after { transform: translateX(16px); background: var(--go-ink); }
.note { font-size: 14px; color: var(--muted); }
.spacer { flex: 1 0 0; }

/* Walk */
.walk { overflow: hidden; gap: 12px; }
.status-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 24px; }
.state { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 600; font-size: 18px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--go); }
.state-dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.meta { font-size: 14px; color: var(--muted); text-align: right; }
.meta .warn { color: var(--pause); }
.tally { position: relative; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; background: var(--surface); border-radius: 24px; padding: 14px 20px 10px; }
.tally .laps { font-size: clamp(84px, 19vh, 168px); line-height: 0.9; letter-spacing: -0.02em; }
.dist-col { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; padding-bottom: 10px; min-width: 0; }
.tally .dist { font-size: clamp(40px, 7.5vh, 60px); white-space: nowrap; }
.tally .laps { white-space: nowrap; }
/* Hidden copies of the widest numbers we expect (999 laps, 9999 m), used to size the tally so the two never overlap. */
.fit-probe { position: absolute; left: 0; top: 0; visibility: hidden; pointer-events: none; white-space: nowrap; }
.goal { display: flex; flex-direction: column; gap: 6px; }
.bar { height: 14px; border-radius: 7px; background: var(--line); overflow: hidden; }
.fill { height: 100%; width: 0; border-radius: 7px; background: var(--go); transition: width 0.3s; }
.goal-text { display: flex; justify-content: space-between; gap: 12px; font-size: 16px; }
.goal-text strong { font-weight: 600; }
.info-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--muted); }
.info-row .time { font-size: 28px; color: var(--fg); margin-left: 4px; }
.speed-row { display: flex; align-items: baseline; gap: 4px; color: var(--muted); margin-top: -4px; }
.speed-row .speed { font-size: 28px; color: var(--fg); margin-left: 4px; }
.speed-row .unit { font-size: 18px; }
.mini { min-height: 44px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line-strong); background: transparent; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 15px; }
.big {
  flex: 1 1 auto; min-height: 140px; width: 100%; border: none; border-radius: 30px;
  background: var(--go); color: var(--go-ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 12px;
}
.big-label { font-size: clamp(64px, 14vh, 112px); letter-spacing: 0.06em; }
.big-sub { font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; }
.big.flash { animation: flash 0.35s ease-out; }
@keyframes flash { from { filter: brightness(1.35); transform: scale(0.98); } to { filter: none; transform: none; } }
.walk .row .btn { min-height: clamp(72px, 11vh, 96px); font-size: 30px; }
.walk[data-state="paused"] .state { color: var(--pause); }
.walk[data-state="paused"] .info-row .time { color: var(--pause); }
.walk[data-state="paused"] .fill { background: var(--pause); }

/* Summary */
.sum-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.sum-head > div { display: flex; flex-direction: column; gap: 4px; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--go-tint); color: var(--go); font-weight: 600; font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0; text-align: center; }
.stats div { display: flex; flex-direction: column-reverse; gap: 2px; }
.stats dt { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; color: var(--muted); }
.stats dd { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 28px; font-variant-numeric: tabular-nums; }
.stats dd small { font-size: 16px; color: var(--muted); }
.laplist { flex: 1 1 auto; min-height: 170px; overflow-y: auto; background: var(--surface); border-radius: 18px; padding: 0 16px 8px; }
.laplist table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.laplist th { position: sticky; top: 0; background: var(--surface); padding: 10px 0 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); text-align: right; border-bottom: 1px solid var(--line); }
.laplist td { padding: 5px 0; font-family: var(--font-display); font-weight: 600; font-size: 20px; text-align: right; }
.laplist th:first-child, .laplist td:first-child { text-align: left; }
.laplist tr.best td { color: var(--go); }

/* History */
.hist-head { display: flex; align-items: center; gap: 12px; }
.hist-head .h1 { flex: 1; }
.icon-btn { width: 56px; height: 56px; border-radius: 16px; border: 2px solid var(--line-strong); background: transparent; display: flex; align-items: center; justify-content: center; }
.hist-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.walk-card { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px; display: flex; align-items: center; gap: 16px; }
.walk-card .count { width: 64px; display: flex; flex-direction: column; align-items: center; }
.walk-card .count .num { font-size: 50px; }
.walk-card .count span:last-child { font-size: 12px; letter-spacing: 0.14em; color: var(--muted); }
.walk-card .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.walk-card .body .num { font-size: 30px; }
.walk-card .sub { font-size: 15px; color: var(--muted); }
.walk-card .m { display: flex; flex-direction: column; align-items: flex-start; }
.walk-card .spd { font-size: 22px; line-height: 1.1; color: var(--go); white-space: nowrap; }
.empty { padding: 32px 8px; text-align: center; color: var(--muted); font-size: 17px; text-wrap: balance; }

/* Sheet + toast */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 560px; background: var(--surface); border-top: 1px solid var(--line); border-radius: 28px 28px 0 0;
  padding-top: 24px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.sheet h2 { font-family: var(--font-display); font-weight: 700; font-size: 36px; line-height: 1; }
.sheet p { font-size: 18px; color: var(--muted); }
.sheet .btn { min-height: 84px; font-size: 30px; }
.toast {
  position: fixed; z-index: 30; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 50%; transform: translateX(-50%);
  width: max-content; max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 14px;
  background: var(--fg); color: var(--bg); font-weight: 600; font-size: 16px; text-align: center;
}
@media (prefers-reduced-motion: reduce) {
  .big.flash { animation: none; }
  .fill, .knob::after { transition: none; }
}
</style>
</head>
<body>
<div id="app">
  <!-- Home -->
  <section id="home" class="screen home" aria-labelledby="home-title">
    <button id="btn-close" class="close-btn" aria-label="Close app" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
    </button>
    <div class="home-head">
      <h1 id="home-title" class="eyebrow">Lap counter</h1>
      <p id="home-last" class="muted"></p>
    </div>
    <button id="btn-start" class="start-dial">
      <span class="num">START</span>
      <small>set track and goal next</small>
    </button>
    <button id="btn-history" class="btn">
      <span class="btn-line">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v4h4"></path><path d="M12 7v5l3 2"></path></svg>
        History
      </span>
    </button>
  </section>

  <!-- Setup -->
  <section id="setup" class="screen" aria-labelledby="setup-title" hidden>
    <h1 id="setup-title" class="h1">Set up your walk</h1>
    <div class="fields">
      <button id="f-track" class="field" data-field="track" aria-pressed="true">
        <span class="field-top"><span>Track length (one lap)</span></span>
        <span class="field-box"><span id="v-track" class="num field-val"></span><span class="unit">m</span></span>
      </button>
      <button id="f-goal" class="field" data-field="goal" aria-pressed="false">
        <span class="field-top"><span>Goal distance</span><span id="goal-hint">optional</span></span>
        <span class="field-box"><span id="v-goal" class="num field-val"></span><span class="unit">m</span></span>
      </button>
    </div>
    <div id="keypad" class="keypad" role="group" aria-label="Number pad"></div>
    <div class="opts">
      <button id="sw-beep" class="switch" role="switch" aria-checked="true"><span class="knob" aria-hidden="true"></span>Beep</button>
      <button id="sw-voice" class="switch" role="switch" aria-checked="false"><span class="knob" aria-hidden="true"></span>Voice</button>
      <button id="btn-test" class="chip">Test feedback</button>
    </div>
    <p id="test-note" class="note" aria-live="polite" hidden></p>
    <div class="spacer"></div>
    <div class="row">
      <button id="setup-back" class="btn">Back</button>
      <button id="btn-go" class="btn btn-go wide">
        <span class="btn-line">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"></path></svg>
          Go
        </span>
      </button>
    </div>
  </section>

  <!-- Walk (running / paused) -->
  <section id="walk" class="screen walk" data-state="running" aria-label="Walk in progress" hidden>
    <div class="status-row">
      <span class="state"><span class="state-dot" aria-hidden="true"></span><span id="w-state">Walking</span></span>
      <span class="meta"><span id="w-track"></span> · <span id="w-awake"></span></span>
    </div>
    <div class="tally">
      <div>
        <div class="label">Laps</div>
        <div id="w-laps" class="num laps" aria-live="polite">0</div>
      </div>
      <div class="dist-col">
        <div class="label">Distance</div>
        <div class="num dist"><span id="w-dist">0</span><span class="unit"> m</span></div>
      </div>
    </div>
    <div id="w-goal" class="goal">
      <div class="bar" aria-hidden="true"><div id="w-fill" class="fill"></div></div>
      <div class="goal-text"><strong id="w-togo"></strong><span id="w-goalv" class="muted"></span></div>
    </div>
    <div class="info-row">
      <span>Time<span id="w-time" class="num time">0:00</span></span>
      <button id="btn-undo" class="mini">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></svg>
        Undo last lap
      </button>
    </div>
    <div class="speed-row" aria-live="polite">
      <span>Avg speed</span><span id="w-speed" class="num speed">–</span><span class="unit">km/h</span>
    </div>
    <button id="btn-main" class="big">
      <span id="main-label" class="num big-label">LAP</span>
      <span id="main-sub" class="big-sub"></span>
    </button>
    <div class="row">
      <button id="btn-left" class="btn"></button>
      <button id="btn-right" class="btn"></button>
    </div>
  </section>

  <!-- Summary -->
  <section id="summary" class="screen" aria-labelledby="s-title" hidden>
    <div class="sum-head">
      <div>
        <h1 id="s-title" class="h1">Walk done</h1>
        <p id="s-date" class="muted"></p>
      </div>
      <span id="s-badge" class="badge" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17 19 7"></path></svg>
        <span id="s-badge-text"></span>
      </span>
    </div>
    <div class="tally">
      <div>
        <div class="label">Laps</div>
        <div id="s-laps" class="num laps"></div>
      </div>
      <div class="dist-col">
        <div class="label">Distance</div>
        <div class="num dist"><span id="s-dist"></span><span class="unit"> m</span></div>
      </div>
    </div>
    <dl class="stats">
      <div><dt>TIME</dt><dd id="s-time"></dd></div>
      <div><dt>AVG LAP</dt><dd id="s-avg"></dd></div>
      <div><dt>SPEED</dt><dd><span id="s-speed"></span><small> km/h</small></dd></div>
    </dl>
    <div class="laplist">
      <table>
        <thead><tr><th scope="col">Lap</th><th scope="col">Dist (m)</th><th scope="col">Split</th><th scope="col">Time</th></tr></thead>
        <tbody id="s-rows"></tbody>
      </table>
    </div>
    <div class="row">
      <button id="s-left" class="btn"></button>
      <button id="s-right" class="btn wide"></button>
    </div>
  </section>

  <!-- History -->
  <section id="history" class="screen" aria-labelledby="h-title" hidden>
    <div class="hist-head">
      <button id="h-back" class="icon-btn" aria-label="Back to home">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"></path></svg>
      </button>
      <h1 id="h-title" class="h1">History</h1>
      <span id="h-count" class="muted"></span>
    </div>
    <ul id="h-list" class="hist-list"></ul>
    <p id="h-empty" class="empty" hidden>Walks you finish are saved here. Tap Start on the home screen to begin one.</p>
  </section>
</div>

<div id="sheet" class="sheet-wrap" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title"></h2>
    <p id="sheet-text"></p>
    <button id="sheet-cancel" class="btn btn-safe"></button>
    <button id="sheet-ok" class="btn"></button>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  "use strict";
  var MIN_LAP_MS = 5000;
  var $ = function (id) { return document.getElementById(id); };

  // ---------- storage (this phone) ----------
  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }

    $("s-time").textContent = fmt(t);
    $("s-avg").textContent = n ? fmt(t / n) : "–";
    $("s-speed").textContent = t > 0 ? (dist / (t / 1000) * 3.6).toFixed(1) : "–";
    var best = Math.min.apply(null, rec.splits);
    var tb = $("s-rows"); tb.textContent = "";
    var run = 0;
    rec.splits.forEach(function (sp, i) {
      run += sp;
      var tr = document.createElement("tr");
      if (sp === best && n > 1) tr.className = "best";
      [String(i + 1), String(mdist((i + 1), rec.track)), fmt(sp), fmt(run)].forEach(function (v) {
        var td = document.createElement("td"); td.textContent = v; tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    var L = $("s-left"), R = $("s-right");
    if (from === "finish") {
      L.className = "btn"; L.textContent = "Home";
      R.className = "btn btn-go wide"; R.textContent = "New walk";
    } else {
      L.className = "btn"; L.textContent = "Back";
      R.className = "btn btn-stop wide"; R.textContent = "Delete walk";
    }
    show("summary");
    summaryTrack = rec.track;
    fitTally($("summary"), rec.track);
  }
  $("s-left").addEventListener("click", function () {
    show(summaryCtx && summaryCtx.from === "history" ? "history" : "home");
  });
  $("s-right").addEventListener("click", function () {
    if (!summaryCtx) return;
    if (summaryCtx.from === "finish") { activeField = "track"; show("setup"); return; }
    var rec = summaryCtx.rec;
    openSheet({
      title: "Delete this walk?",
      text: fmtDate(rec.startedAt) + " · " + plural(rec.splits.length, "lap") + " · " + (mdist(rec.splits.length, rec.track)) + " m will be removed from history.",
      cancel: "Cancel · keep it", ok: "Yes, delete", okClass: "btn-stop",
      onOk: function () { deleteWalk(rec); show("history"); toast("Walk deleted"); }
    });
  });

  // ---------- history ----------
  function renderHistory() {
    var list = $("h-list"); list.textContent = "";
    var items = history.slice().sort(function (a, b) { return b.startedAt - a.startedAt; });
    $("h-empty").hidden = items.length > 0;
    $("h-count").textContent = items.length ? plural(items.length, "walk") : "";
    items.forEach(function (rec) {
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.className = "walk-card";
      var n = rec.splits.length;
      b.innerHTML =
        '<span class="count"><span class="num"></span><span>LAPS</span></span>' +
        '<span class="body"><span class="sub d"></span><span class="num m"></span><span class="sub t"></span></span>' +
        '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--muted)"><path d="m9 5 7 7-7 7"></path></svg>';
      b.querySelector(".count .num").textContent = n;
      b.querySelector(".d").textContent = fmtDate(rec.startedAt);
      var hd = mdist(n, rec.track), ht = sum(rec.splits);
      var dEl = document.createElement("span"); dEl.textContent = hd + " m";
      var sEl = document.createElement("span"); sEl.className = "spd";
      sEl.textContent = ht > 0 ? (hd / (ht / 1000) * 3.6).toFixed(1) + " km/h" : "";
      b.querySelector(".m").appendChild(dEl); b.querySelector(".m").appendChild(sEl);
      b.querySelector(".t").textContent = fmt(sum(rec.splits)) + " · " + rec.track + " m track" + (rec.goal > 0 && mdist(n, rec.track) >= rec.goal ? " · goal reached" : "");
      b.addEventListener("click", function () { openSummary(rec, "history"); });
      li.appendChild(b); list.appendChild(li);
    });
  }
  $("h-back").addEventListener("click", function () { show("home"); });

  // ---------- cloud copy of history (artifact store), when available ----------
  var db = null, pending = {};
  function syncUp(rec) {
    if (!db || pending[rec.id]) return;
    pending[rec.id] = true;
    db.collection("walks").doc(rec.id).set({
      startedAt: rec.startedAt, track: rec.track, goal: rec.goal, splits: rec.splits, totalMs: rec.totalMs
    }).then(function () {
      history.forEach(function (r) { if (r.id === rec.id) r.synced = true; });
      saveHistory();
    }).catch(function () {}).then(function () { delete pending[rec.id]; });
  }
  function deleteWalk(rec) {
    history = history.filter(function (r) { return r.id !== rec.id; });
    saveHistory();
    if (db) { try { db.collection("walks").doc(rec.id).delete().catch(function () {}); } catch (e) {} }
  }
  (function connectStore() {
    var c = window.claude;
    if (!c || typeof c.use !== "function") return;
    c.use("db").then(function (store) {
      if (!store) return;
      db = store;
      db.collection("walks").onSnapshot(function (snap) {
        var remote = {}, merged = [];
        snap.docs.forEach(function (d) {
          var v = d.data();
          if (!v || !Array.isArray(v.splits)) return;
          var rec = { id: d.id, startedAt: +v.startedAt || 0, track: +v.track || 0, goal: +v.goal || 0, splits: v.splits.map(Number), totalMs: +v.totalMs || 0, synced: true };
          remote[d.id] = true; merged.push(rec);
        });
        history.forEach(function (r) {
          if (remote[r.id]) return;
          if (r.synced && !snap.metadata.fromCache) return; // deleted from another device
          merged.push(r);
          if (!r.synced) syncUp(r);
        });
        history = merged; saveHistory();
        if (current === "history") renderHistory();
      }, function () {});
    }).catch(function () {});
  })();

  // ---------- Android back button ----------
  // Returns true when the page handled it; false lets the app close.
  window.lcBack = function () {
    if (!$("sheet").hidden) { closeSheet(); return true; }
    if (current === "walk") { toast("Use Pause or Stop to leave the walk"); return true; }
    if (current === "setup" || current === "history") { show("home"); return true; }
    if (current === "summary") { show(summaryCtx && summaryCtx.from === "history" ? "history" : "home"); return true; }
    return false;
  };

  // ---------- start ----------
  if (session && session.id && Array.isArray(session.splits)) {
    show("walk");
    keepAwake(true);
  } else {
    session = null; saveSession();
    show("home");
  }
})();
</script>
</body>
</html>
