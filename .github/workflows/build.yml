name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Add fonts
        run: |
          mkdir -p app/src/main/assets/fonts
          cd app/src/main/assets/fonts
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          for f in barlowcondensed/BarlowCondensed-SemiBold.ttf barlowcondensed/BarlowCondensed-Bold.ttf barlow/Barlow-Medium.ttf barlow/Barlow-SemiBold.ttf; do
            curl -sSfL -o "$(basename $f)" "$base/$f" || echo "Could not fetch $f; the app falls back to system fonts"
          done
          ls -la

      - name: Build
        run: gradle :app:assembleRelease --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk LapCounter.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Lap Counter 1.0.${{ github.run_number }}
          body: Download LapCounter.apk below and open it on your phone to install.
          files: LapCounter.apk
          make_latest: true
